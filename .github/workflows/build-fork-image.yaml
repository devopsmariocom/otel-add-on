name: 'Build fork image'

on:
  push:
    branches: [build/fork-image]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/otel-add-on

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: make test

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          sha="${GITHUB_SHA::7}"
          echo "version=v0.1.5-gc-${sha}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:fix-series-retention-gc
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "Image: \`${IMAGE}:${{ steps.tags.outputs.version }}\`"
            echo "Floating: \`${IMAGE}:fix-series-retention-gc\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
